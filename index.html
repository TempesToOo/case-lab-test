<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Lab v2</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#05060d;color:#fff;font:15px system-ui}main{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.sub{color:#a995ff;font-size:11px;letter-spacing:2px}.card{background:#10121cdd;border:1px solid #2b2d48;border-radius:18px;padding:14px;margin:12px 0}.hero{position:relative;overflow:hidden;min-height:240px;background:url("assets/case_lab_visual.png") center 18%/cover;border-color:#5739a0}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#070812ee,#07081288,#070812ee)}.hero>*{position:relative;z-index:1}.hero h1{font-size:32px;margin:6px 0}.muted{color:#989cad;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tabs button{padding:11px;border-radius:11px;border:1px solid #292d42;background:#11131d;color:#aaaec0}.tabs .on{background:#38226d;color:#fff;border-color:#7657ff}.page{display:none}.page.on{display:block}.cases,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.case{background:#11131d;border:1px solid #2c3046;border-radius:15px;padding:10px}.case img{width:100%;height:150px;object-fit:cover;border-radius:11px}.case h3{margin:8px 0 3px}button.primary{background:linear-gradient(90deg,#6d3ff0,#8b4dff);color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:800}.item{background:#11131d;border:1px solid #34374d;border-radius:14px;overflow:hidden}.item img{width:100%;height:120px;object-fit:cover}.item div{padding:9px}.rare{border-color:#3e9cff}.epic{border-color:#a85cff}.legendary{border-color:#ffb72e}.mythic{border-color:#ff3e83}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:15px}.hidden{display:none}.modalbox{width:min(620px,100%);background:#0d0f18;border:1px solid #4a3b79;border-radius:20px;padding:18px;text-align:center}.roll{display:flex;gap:8px;overflow:hidden;margin:15px 0;height:120px}.roll img{min-width:150px;width:150px;height:120px;object-fit:cover;border-radius:12px;border:1px solid #333751}.result{font-size:20px;margin:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{padding:14px;text-align:center;background:#11131d;border:1px solid #292d42;border-radius:12px}@media(max-width:560px){.tabs{grid-template-columns:repeat(2,1fr)}.cases,.grid{grid-template-columns:1fr}.hero{min-height:260px}}</style></head><body><main><div class="top"><div><div class="sub">TELEGRAM MINI APP • TEST</div><div class="logo">CASE <span style="color:#9b5cff">LAB</span></div></div><div class="card" style="margin:0">⭐ Lv. <b id="level">1</b></div></div><div class="card hero"><h1>Кибер-коллекция</h1><p>Бесплатные открытия и оригинальные коллекционные предметы.</p><button class="primary" onclick="openCase()">🎁 Открыть бесплатно</button></div><nav class="tabs"><button class="on" data-p="cases">🎁 Кейсы</button><button data-p="inventory">🎒 Инвентарь</button><button data-p="collection">🏆 Коллекция</button><button data-p="profile">👤 Профиль</button></nav><section id="cases" class="page on"><h3>Доступные кейсы</h3><div id="casesList" class="cases"></div></section><section id="inventory" class="page"><h3>Инвентарь <span id="count" class="muted"></span></h3><div id="items" class="grid"></div></section><section id="collection" class="page"><div class="card"><h3>Вся коллекция</h3><div id="colgrid" class="grid"></div></div></section><section id="profile" class="page"><div class="stats"><div><b id="opened">0</b><span class="muted">открытий</span></div><div><b id="xp">0</b><span class="muted">XP</span></div><div><b id="itemsn">0</b><span class="muted">предметов</span></div></div></section></main><div id="modal" class="modal hidden"><div class="modalbox"><b>Открытие кейса</b><div id="roll" class="roll"></div><div id="result" class="result"></div><button class="primary" id="close">Продолжить</button></div></div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const A='assets/';const items=[['neon_fang.png','Neon Fang','mythic'],['void_cortex.png','Void Cortex','mythic'],['astral_core.png','Astral Core','legendary'],['radiant_edge.png','Radiant Edge','legendary'],['cyber_claws.png','Cyber Claws','epic'],['photon_blaster.png','Photon Blaster','rare']];let s=JSON.parse(localStorage.caseLabV2||'null')||{xp:0,opened:0,inv:[]};function save(){localStorage.caseLabV2=JSON.stringify(s)}function pick(){let r=Math.random();return r<.02?'mythic':r<.12?'legendary':r<.35?'epic':r<.7?'rare':'common'}function get(r){let a=items.filter(x=>x[2]==r);return a.length?a[Math.floor(Math.random()*a.length)]:items[5]}function render(){document.querySelector('#level').textContent=1+Math.floor(s.xp/100);document.querySelector('#opened').textContent=s.opened;document.querySelector('#xp').textContent=s.xp;document.querySelector('#count').textContent=s.inv.length;document.querySelector('#itemsn').textContent=s.inv.length;document.querySelector('#casesList').innerHTML=`<div class="case"><img src="${A}case_lab_visual.png"><h3>Кибер-коллекция</h3><p class="muted">Все открытия бесплатные</p><button class="primary" onclick="openCase()">Открыть</button></div><div class="case"><img src="${A}neon_fang.png"><h3>Неоновый кейс</h3><p class="muted">Бесплатное открытие</p><button class="primary" onclick="openCase()">Открыть</button></div>`;document.querySelector('#items').innerHTML=s.inv.length?s.inv.map(x=>`<div class="item ${x[2]}"><img src="${A+x[0]}"><div><b>${x[1]}</b><div class="muted">${x[2]}</div></div></div>`).join(''):'<p class="muted">Открой первый кейс.</p>';document.querySelector('#colgrid').innerHTML=items.map(x=>`<div class="item ${x[2]}"><img src="${A+x[0]}"><div><b>${x[1]}</b><div class="muted">${x[2]}</div></div></div>`).join('')}function openCase(){let r=pick(),it=get(r),m=document.querySelector('#modal'),roll=document.querySelector('#roll');m.classList.remove('hidden');document.querySelector('#result').textContent='Открываем…';roll.innerHTML=Array.from({length:10},()=>{let x=items[Math.floor(Math.random()*items.length)];return `<img src="${A+x[0]}">`}).join('');s.inv.unshift(it);s.opened++;s.xp+=20;save();setTimeout(()=>{roll.scrollTo({left:roll.scrollWidth,behavior:'smooth'});document.querySelector('#result').innerHTML=`<b>${it[1]}</b><br><span class="muted">${r}</span>`;render()},900)}document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.add('hidden');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#'+b.dataset.p).classList.add('on')});render();</script></body></html>
